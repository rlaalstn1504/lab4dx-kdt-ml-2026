<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="480" y="42" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#1f2937">
    이산형 분포와 연속형 분포
  </text>
  <text x="480" y="74" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#4b5563">
    확률변수가 어떤 값을 가질 수 있는지에 따라 확률을 읽는 방식이 달라집니다.
  </text>

  <rect x="50" y="105" width="400" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="510" y="105" width="400" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="250" y="140" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#0f766e">
    이산형 확률변수
  </text>
  <text x="710" y="140" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="#7c3aed">
    연속형 확률변수
  </text>

  <text x="250" y="170" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#374151">
    셀 수 있는 값만 가집니다. 예: 주사위 눈금
  </text>
  <text x="710" y="170" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#374151">
    구간 안의 모든 실수값을 가질 수 있습니다. 예: 키, 시간
  </text>

  <!-- Left chart: discrete PMF -->
  <line x1="105" y1="355" x2="400" y2="355" stroke="#334155" stroke-width="2"/>
  <line x1="105" y1="355" x2="105" y2="205" stroke="#334155" stroke-width="2"/>
  <text x="250" y="392" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#334155">값 x</text>
  <text x="75" y="278" text-anchor="middle" transform="rotate(-90 75 278)" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#334155">확률 P(X=x)</text>

  <g fill="#14b8a6" stroke="#0f766e" stroke-width="2">
    <rect x="125" y="280" width="28" height="75"/>
    <rect x="170" y="280" width="28" height="75"/>
    <rect x="215" y="280" width="28" height="75"/>
    <rect x="260" y="280" width="28" height="75"/>
    <rect x="305" y="280" width="28" height="75"/>
    <rect x="350" y="280" width="28" height="75"/>
  </g>
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    <text x="139" y="374">1</text>
    <text x="184" y="374">2</text>
    <text x="229" y="374">3</text>
    <text x="274" y="374">4</text>
    <text x="319" y="374">5</text>
    <text x="364" y="374">6</text>
    <text x="96" y="285" text-anchor="end">1/6</text>
  </g>
  <line x1="105" y1="280" x2="400" y2="280" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <circle cx="229" cy="280" r="6" fill="#f97316"/>
  <text x="250" y="230" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#ea580c">
    P(X = 3)처럼 한 값의 확률을 읽습니다.
  </text>

  <!-- Right chart: continuous density -->
  <line x1="565" y1="355" x2="860" y2="355" stroke="#334155" stroke-width="2"/>
  <line x1="565" y1="355" x2="565" y2="205" stroke="#334155" stroke-width="2"/>
  <text x="710" y="392" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#334155">값 x</text>
  <text x="535" y="278" text-anchor="middle" transform="rotate(-90 535 278)" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#334155">밀도 f(x)</text>

  <path d="M 590 354
           C 615 350, 632 335, 650 306
           C 670 272, 688 224, 710 224
           C 732 224, 750 272, 770 306
           C 788 335, 805 350, 830 354
           L 830 355 L 590 355 Z"
        fill="#ddd6fe"/>
  <path d="M 666 355
           C 676 291, 692 224, 710 224
           C 728 224, 744 291, 754 355
           Z"
        fill="#a78bfa" opacity="0.7"/>
  <path d="M 590 354
           C 615 350, 632 335, 650 306
           C 670 272, 688 224, 710 224
           C 732 224, 750 272, 770 306
           C 788 335, 805 350, 830 354"
        fill="none" stroke="#7c3aed" stroke-width="4"/>
  <line x1="666" y1="355" x2="666" y2="250" stroke="#6d28d9" stroke-dasharray="5 5"/>
  <line x1="754" y1="355" x2="754" y2="250" stroke="#6d28d9" stroke-dasharray="5 5"/>
  <text x="666" y="374" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">a</text>
  <text x="754" y="374" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#334155">b</text>
  <text x="710" y="230" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#6d28d9">
    P(a ≤ X ≤ b)는 곡선 아래 면적입니다.
  </text>

  <rect x="86" y="410" width="328" height="58" rx="8" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="250" y="434" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#065f46">
    기대값: 가능한 값 × 그 값의 확률을 모두 더함
  </text>
  <text x="250" y="458" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#065f46">
    E[X] = Σ x · P(X=x)
  </text>

  <rect x="546" y="410" width="328" height="58" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="710" y="434" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#5b21b6">
    기대값: 모든 구간을 아주 잘게 나눠 누적함
  </text>
  <text x="710" y="458" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#5b21b6">
    E[X] = ∫ x · f(x) dx
  </text>

  <text x="480" y="496" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#64748b">
    김민수 강사
  </text>
</svg>
