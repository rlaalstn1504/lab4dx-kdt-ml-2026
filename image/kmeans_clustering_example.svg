<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">K-means clustering example</title>
  <desc id="desc">Three groups of points are assigned to their nearest centroid in K-means clustering.</desc>
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">
    K-means clustering (K=3)
  </text>
  <text x="450" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">
    assign points to the nearest centroid, then update centroids and repeat
  </text>

  <rect x="80" y="105" width="740" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="120" y1="390" x2="780" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="390" x2="120" y2="130" stroke="#94a3b8" stroke-width="2"/>
  <text x="790" y="397" font-family="Arial, sans-serif" font-size="13" fill="#64748b">feature 1</text>
  <text x="82" y="126" font-family="Arial, sans-serif" font-size="13" fill="#64748b">feature 2</text>

  <g opacity="0.18" fill="#2563eb"><ellipse cx="247" cy="288" rx="95" ry="70"/></g>
  <g fill="#2563eb" stroke="#1e40af" stroke-width="2">
    <circle cx="190" cy="295" r="9"/><circle cx="220" cy="247" r="9"/>
    <circle cx="238" cy="315" r="9"/><circle cx="266" cy="270" r="9"/>
    <circle cx="286" cy="330" r="9"/><circle cx="302" cy="292" r="9"/>
    <circle cx="232" cy="278" r="9"/><circle cx="265" cy="238" r="9"/>
  </g>

  <g opacity="0.18" fill="#16a34a"><ellipse cx="460" cy="190" rx="105" ry="78"/></g>
  <g fill="#16a34a" stroke="#166534" stroke-width="2">
    <circle cx="402" cy="183" r="9"/><circle cx="430" cy="145" r="9"/>
    <circle cx="455" cy="212" r="9"/><circle cx="480" cy="165" r="9"/>
    <circle cx="516" cy="205" r="9"/><circle cx="505" cy="132" r="9"/>
    <circle cx="442" cy="238" r="9"/><circle cx="535" cy="175" r="9"/>
  </g>

  <g opacity="0.18" fill="#f97316"><ellipse cx="650" cy="310" rx="105" ry="76"/></g>
  <g fill="#f97316" stroke="#c2410c" stroke-width="2">
    <circle cx="598" cy="310" r="9"/><circle cx="620" cy="268" r="9"/>
    <circle cx="643" cy="340" r="9"/><circle cx="675" cy="292" r="9"/>
    <circle cx="704" cy="328" r="9"/><circle cx="720" cy="277" r="9"/>
    <circle cx="650" cy="252" r="9"/><circle cx="690" cy="365" r="9"/>
  </g>

  <g stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
    <line x1="247" y1="288" x2="190" y2="295"/>
    <line x1="247" y1="288" x2="266" y2="270"/>
    <line x1="460" y1="190" x2="430" y2="145"/>
    <line x1="460" y1="190" x2="516" y2="205"/>
    <line x1="650" y1="310" x2="598" y2="310"/>
    <line x1="650" y1="310" x2="704" y2="328"/>
  </g>

  <g transform="translate(247 288)">
    <polygon points="0,-18 5,-6 18,-6 8,2 12,16 0,8 -12,16 -8,2 -18,-6 -5,-6" fill="#facc15" stroke="#713f12" stroke-width="2"/>
  </g>
  <g transform="translate(460 190)">
    <polygon points="0,-18 5,-6 18,-6 8,2 12,16 0,8 -12,16 -8,2 -18,-6 -5,-6" fill="#facc15" stroke="#713f12" stroke-width="2"/>
  </g>
  <g transform="translate(650 310)">
    <polygon points="0,-18 5,-6 18,-6 8,2 12,16 0,8 -12,16 -8,2 -18,-6 -5,-6" fill="#facc15" stroke="#713f12" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2937">
    <rect x="112" y="445" width="676" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="145" cy="466" r="8" fill="#2563eb"/><text x="162" y="471">cluster 1</text>
    <circle cx="255" cy="466" r="8" fill="#16a34a"/><text x="272" y="471">cluster 2</text>
    <circle cx="365" cy="466" r="8" fill="#f97316"/><text x="382" y="471">cluster 3</text>
    <polygon points="496,448 501,460 514,460 504,468 508,482 496,474 484,482 488,468 478,460 491,460" fill="#facc15" stroke="#713f12" stroke-width="2"/>
    <text x="525" y="471">centroid</text>
    <line x1="630" y1="466" x2="685" y2="466" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="700" y="471">nearest assignment</text>
  </g>
</svg>
