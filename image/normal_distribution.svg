<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="450" y="44" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="28" font-weight="700" fill="#1f2937">
    정규분포
  </text>
  <text x="450" y="76" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" fill="#4b5563">
    평균을 중심으로 좌우가 대칭인 종 모양 분포입니다.
  </text>

  <rect x="70" y="108" width="760" height="292" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>

  <!-- chart area -->
  <line x1="130" y1="342" x2="770" y2="342" stroke="#334155" stroke-width="2"/>
  <line x1="130" y1="342" x2="130" y2="150" stroke="#334155" stroke-width="2"/>
  <text x="450" y="382" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#334155">값 x</text>
  <text x="100" y="250" text-anchor="middle" transform="rotate(-90 100 250)" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#334155">확률밀도 f(x)</text>

  <!-- shaded 68% region, approximated between mu-sigma and mu+sigma -->
  <path d="M 360 342
           C 374 286, 398 194, 450 194
           C 502 194, 526 286, 540 342
           Z"
        fill="#bfdbfe" opacity="0.95"/>
  <path d="M 270 342
           C 300 336, 328 311, 360 342
           L 360 342 Z"
        fill="#dbeafe" opacity="0.85"/>
  <path d="M 540 342
           C 572 311, 600 336, 630 342
           L 540 342 Z"
        fill="#dbeafe" opacity="0.85"/>

  <!-- normal curve -->
  <path d="M 170 341
           C 214 339, 244 332, 270 315
           C 305 292, 327 252, 360 220
           C 389 192, 416 178, 450 178
           C 484 178, 511 192, 540 220
           C 573 252, 595 292, 630 315
           C 656 332, 686 339, 730 341"
        fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>

  <!-- vertical guides -->
  <line x1="450" y1="342" x2="450" y2="178" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="360" y1="342" x2="360" y2="220" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="540" y1="342" x2="540" y2="220" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="270" y1="342" x2="270" y2="315" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="630" y1="342" x2="630" y2="315" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- x-axis labels -->
  <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <text x="270" y="365">μ - 2σ</text>
    <text x="360" y="365">μ - σ</text>
    <text x="450" y="365" font-weight="700" fill="#1d4ed8">μ</text>
    <text x="540" y="365">μ + σ</text>
    <text x="630" y="365">μ + 2σ</text>
  </g>

  <!-- annotations -->
  <rect x="330" y="135" width="240" height="36" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="450" y="159" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">
    평균 μ를 기준으로 좌우 대칭
  </text>

  <path d="M 360 258 C 390 240, 510 240, 540 258" fill="none" stroke="#f97316" stroke-width="3"/>
  <polygon points="360,258 371,251 371,265" fill="#f97316"/>
  <polygon points="540,258 529,251 529,265" fill="#f97316"/>
  <text x="450" y="281" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16" font-weight="700" fill="#ea580c">
    약 68%
  </text>

  <rect x="112" y="414" width="676" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="438" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#374151">
    μ는 중심 위치, σ는 퍼짐 정도입니다. σ가 커질수록 곡선은 더 넓고 낮아집니다.
  </text>
  <text x="450" y="462" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="15" fill="#374151">
    정규분포는 키, 측정 오차, 시험 점수처럼 평균 주변에 값이 많이 모이는 현상을 설명할 때 자주 사용합니다.
  </text>

  <text x="450" y="500" text-anchor="middle" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="13" fill="#64748b">
    김민수 강사
  </text>
</svg>
