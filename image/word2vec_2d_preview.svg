  </text>
  <text x="490" y="76" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#475569">
    단어 벡터를 2차원으로 줄여 그리면, 비슷하게 쓰인 단어들이 가까이 모여 보입니다.
  </text>

  <g filter="url(#shadow)">
    <rect x="88" y="104" width="804" height="342" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  </g>

  <line x1="140" y1="390" x2="842" y2="390" stroke="#94a3b8" stroke-width="2"/>
