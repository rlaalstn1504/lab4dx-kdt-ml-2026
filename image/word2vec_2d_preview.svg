  <text x="846" y="397" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" fill="#64748b">차원 1</text>
  <text x="112" y="142" font-family="Malgun Gothic, Arial, sans-serif" font-size="13" fill="#64748b">차원 2</text>

