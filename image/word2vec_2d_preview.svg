<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="980" height="540" rx="18" fill="#f8fafc"/>

  <text x="490" y="44" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">
