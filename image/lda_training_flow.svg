<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">LDA 학습 단계 시각화</title>
  <desc id="desc">문서는 여러 토픽의 비율로 구성되고, 토픽은 단어들의 확률 분포라는 LDA의 핵심 개념을 초심자용 예시로 설명하는 그림</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 15px; fill: #475569; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .h { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .m { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 14px; fill: #334155; }
      .s { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .xs { font-family: "Malgun Gothic", Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .chip { stroke-width: 1.5; rx: 6; }
      .blue { fill: #eff6ff; stroke: #93c5fd; }
      .green { fill: #f0fdf4; stroke: #86efac; }
      .orange { fill: #fff7ed; stroke: #fdba74; }
      .purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .cycle { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#blueArrow); }
      .grid { stroke: #cbd5e1; stroke-width: 1.3; }
      .bar-bg { fill: #e2e8f0; }
      .bar-football { fill: #60a5fa; }
      .bar-movie { fill: #86efac; }
      .bar-food { fill: #fdba74; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="760"/>

  <text class="title" x="550" y="40" text-anchor="middle">LDA 학습 단계: 문서 안의 숨은 토픽 비율 찾기</text>
  <text class="subtitle" x="550" y="70" text-anchor="middle">핵심: 문서는 여러 토픽의 비율이고, 토픽은 단어들의 확률 분포입니다.</text>

  <g>
    <rect class="card" x="40" y="108" width="260" height="198" rx="12"/>
    <text class="h" x="70" y="140">1. 문서 묶음 준비</text>
    <text class="s" x="70" y="166">정답 라벨 없이 텍스트만 사용</text>

    <rect class="chip blue" x="66" y="186" width="214" height="30"/>
    <text class="t" x="78" y="206">문서 A: 축구 골 선수 경기</text>
    <rect class="chip green" x="66" y="225" width="214" height="30"/>
    <text class="t" x="78" y="245">문서 B: 영화 배우 감독 장면</text>
    <rect class="chip orange" x="66" y="264" width="214" height="30"/>
    <text class="t" x="78" y="284">문서 C: 음식 맛 메뉴 식당</text>
  </g>

  <path class="arrow" d="M310 207 C328 207, 340 207, 358 207"/>

  <g>
    <rect class="card" x="368" y="108" width="280" height="198" rx="12"/>
    <text class="h" x="398" y="140">2. 문서-단어 행렬</text>
    <text class="s" x="398" y="166">숫자는 각 문서에서 단어가 나온 횟수</text>

    <rect x="392" y="184" width="232" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="430" y1="184" x2="430" y2="280" class="grid"/>
    <line x1="469" y1="184" x2="469" y2="280" class="grid"/>
    <line x1="508" y1="184" x2="508" y2="280" class="grid"/>
    <line x1="547" y1="184" x2="547" y2="280" class="grid"/>
    <line x1="586" y1="184" x2="586" y2="280" class="grid"/>
    <line x1="392" y1="208" x2="624" y2="208" class="grid"/>
    <line x1="392" y1="232" x2="624" y2="232" class="grid"/>
    <line x1="392" y1="256" x2="624" y2="256" class="grid"/>

    <text class="xs" x="411" y="201" text-anchor="middle">문서</text>
    <text class="xs" x="450" y="201" text-anchor="middle">축구</text>
    <text class="xs" x="489" y="201" text-anchor="middle">골</text>
    <text class="xs" x="528" y="201" text-anchor="middle">영화</text>
    <text class="xs" x="567" y="201" text-anchor="middle">배우</text>
    <text class="xs" x="605" y="201" text-anchor="middle">음식</text>

    <text class="xs" x="411" y="225" text-anchor="middle">A</text>
    <text class="t" x="450" y="226" text-anchor="middle">2</text>
    <text class="t" x="489" y="226" text-anchor="middle">1</text>
    <text class="t" x="528" y="226" text-anchor="middle">0</text>
    <text class="t" x="567" y="226" text-anchor="middle">0</text>
    <text class="t" x="605" y="226" text-anchor="middle">0</text>

    <text class="xs" x="411" y="249" text-anchor="middle">B</text>
    <text class="t" x="450" y="250" text-anchor="middle">0</text>
    <text class="t" x="489" y="250" text-anchor="middle">0</text>
    <text class="t" x="528" y="250" text-anchor="middle">2</text>
    <text class="t" x="567" y="250" text-anchor="middle">1</text>
    <text class="t" x="605" y="250" text-anchor="middle">0</text>

    <text class="xs" x="411" y="273" text-anchor="middle">C</text>
    <text class="t" x="450" y="274" text-anchor="middle">0</text>
    <text class="t" x="489" y="274" text-anchor="middle">0</text>
    <text class="t" x="528" y="274" text-anchor="middle">0</text>
    <text class="t" x="567" y="274" text-anchor="middle">0</text>
    <text class="t" x="605" y="274" text-anchor="middle">2</text>
    <text class="xs" x="398" y="296">예: 문서 A에서 '축구'가 2번 등장</text>
  </g>

  <path class="arrow" d="M658 207 C676 207, 688 207, 706 207"/>

  <g>
    <rect class="card" x="716" y="108" width="344" height="198" rx="12"/>
    <text class="h" x="746" y="140">3. 찾을 토픽 개수 정하기</text>
    <text class="s" x="746" y="166">예: 3개 토픽을 찾도록 설정</text>

    <rect class="chip blue" x="746" y="191" width="106" height="32"/>
    <text class="t" x="799" y="212" text-anchor="middle">축구 토픽</text>
    <rect class="chip green" x="866" y="191" width="106" height="32"/>
    <text class="t" x="919" y="212" text-anchor="middle">영화 토픽</text>
    <rect class="chip orange" x="746" y="236" width="106" height="32"/>
    <text class="t" x="799" y="257" text-anchor="middle">음식 토픽</text>

    <text class="s" x="866" y="246">처음에는 임시 추정입니다.</text>
    <text class="s" x="866" y="270">반복 학습으로 단어 분포가 조정됩니다.</text>
  </g>

  <path class="arrow" d="M888 314 C888 332, 888 344, 888 362"/>

  <g>
    <rect class="panel" x="80" y="364" width="940" height="168" rx="16"/>
    <text class="h" x="550" y="395" text-anchor="middle">4. 반복 학습: 토픽과 단어 분포를 번갈아 조정</text>
    <text class="subtitle" x="550" y="421" text-anchor="middle">문서 안 단어들을 보며 어떤 토픽이 자연스러운지 여러 번 다시 계산합니다.</text>

    <rect x="128" y="452" width="170" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="m" x="213" y="484" text-anchor="middle">토픽 추정</text>

    <rect x="354" y="452" width="180" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="m" x="444" y="484" text-anchor="middle">단어 분포 수정</text>

    <rect x="590" y="452" width="180" height="52" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text class="m" x="680" y="484" text-anchor="middle">다시 토픽 추정</text>

    <rect x="826" y="452" width="130" height="52" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text class="m" x="891" y="484" text-anchor="middle">반복 학습</text>

    <path class="cycle" d="M300 478 C318 478, 332 478, 350 478"/>
    <path class="cycle" d="M536 478 C554 478, 568 478, 586 478"/>
    <path class="cycle" d="M772 478 C790 478, 804 478, 822 478"/>
    <path class="cycle" d="M891 445 C845 426, 258 426, 213 445"/>
    <text class="s" x="550" y="519" text-anchor="middle">반복이 끝나면 문서별 토픽 비율과 토픽별 단어 확률이 만들어집니다.</text>
  </g>

  <path class="arrow" d="M550 538 C550 556, 550 568, 550 588"/>

  <g>
    <rect class="card" x="56" y="596" width="506" height="136" rx="12"/>
    <text class="h" x="86" y="624">5-1. 문서별 토픽 비율</text>
    <text class="s" x="86" y="648">문서 하나가 여러 토픽의 비율로 표현됨</text>

    <rect x="86" y="663" width="330" height="14" rx="7" class="bar-bg"/>
    <rect x="86" y="663" width="231" height="14" rx="7" class="bar-football"/>
    <rect x="317" y="663" width="66" height="14" class="bar-movie"/>
    <rect x="383" y="663" width="33" height="14" rx="7" class="bar-food"/>
    <text class="s" x="430" y="676">문서 A : 축구 70%, 영화 20%, 음식 10%</text>

    <rect x="86" y="684" width="330" height="14" rx="7" class="bar-bg"/>
    <rect x="86" y="684" width="264" height="14" rx="7" class="bar-movie"/>
    <rect x="350" y="684" width="33" height="14" class="bar-football"/>
    <rect x="383" y="684" width="33" height="14" rx="7" class="bar-food"/>
    <text class="s" x="430" y="697">문서 B : 영화 80%, 축구 10%, 음식 10%</text>
  </g>

  <g>
    <rect class="card" x="594" y="596" width="450" height="136" rx="12"/>
    <text class="h" x="624" y="624">5-2. 토픽별 단어 분포</text>
    <text class="s" x="624" y="648">토픽은 단어들이 나올 확률의 묶음</text>

    <rect class="chip blue" x="624" y="662" width="330" height="22"/>
    <text class="s" x="638" y="677">축구 토픽 : 축구 40%, 골 30%, 선수 20%</text>

    <rect class="chip green" x="624" y="686" width="330" height="22"/>
    <text class="s" x="638" y="701">영화 토픽 : 영화 35%, 배우 30%, 감독 20%</text>

    <rect class="chip orange" x="624" y="710" width="330" height="22"/>
    <text class="s" x="638" y="725">음식 토픽 : 음식 40%, 맛 30%, 메뉴 20%</text>
  </g>
</svg>
