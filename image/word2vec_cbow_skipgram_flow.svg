<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Word2Vec 학습 직관</title>
  <desc id="desc">Word2Vec의 CBOW와 Skip-Gram 학습 방향을 비교한 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .kr { font-family: "Noto Sans CJK KR", "Noto Sans KR", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="980" height="540" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" class="kr" font-size="28" font-weight="700" fill="#111827">
    Word2Vec은 주변 단어와 중심 단어의 관계를 학습한다
  </text>

  <rect x="70" y="90" width="395" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="268" y="128" text-anchor="middle" class="kr" font-size="22" font-weight="700" fill="#1d4ed8">CBOW</text>
  <text x="268" y="158" text-anchor="middle" class="kr" font-size="15" fill="#475569">주변 단어로 중심 단어를 맞힌다</text>

  <rect x="106" y="218" width="78" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="106" y="294" width="78" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="244" text-anchor="middle" class="kr" font-size="15" fill="#1e3a8a">나는</text>
  <text x="145" y="320" text-anchor="middle" class="kr" font-size="15" fill="#1e3a8a">먹었다</text>

  <line x1="188" y1="238" x2="292" y2="268" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="188" y1="314" x2="292" y2="284" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="306" y="246" width="92" height="58" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="352" y="282" text-anchor="middle" class="kr" font-size="20" font-weight="700" fill="#1e3a8a">밥</text>
  <text x="268" y="372" text-anchor="middle" class="kr" font-size="14" fill="#475569">예: 나는, 먹었다 → 밥</text>

  <rect x="515" y="90" width="395" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="713" y="128" text-anchor="middle" class="kr" font-size="22" font-weight="700" fill="#166534">Skip-Gram</text>
  <text x="713" y="158" text-anchor="middle" class="kr" font-size="15" fill="#475569">중심 단어로 주변 단어를 맞힌다</text>

  <rect x="558" y="246" width="92" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="604" y="282" text-anchor="middle" class="kr" font-size="20" font-weight="700" fill="#14532d">밥</text>

  <line x1="654" y1="268" x2="758" y2="238" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="654" y1="284" x2="758" y2="314" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="772" y="218" width="78" height="40" rx="7" fill="#bbf7d0" stroke="#22c55e"/>
  <rect x="772" y="294" width="78" height="40" rx="7" fill="#bbf7d0" stroke="#22c55e"/>
  <text x="811" y="244" text-anchor="middle" class="kr" font-size="15" fill="#14532d">나는</text>
  <text x="811" y="320" text-anchor="middle" class="kr" font-size="15" fill="#14532d">먹었다</text>
  <text x="713" y="372" text-anchor="middle" class="kr" font-size="14" fill="#475569">예: 밥 → 나는, 먹었다</text>

  <rect x="185" y="456" width="610" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="490" y="484" text-anchor="middle" class="kr" font-size="16" fill="#475569">
    두 방식 모두 많이 반복될수록 비슷한 문맥의 단어 벡터가 가까워진다.
  </text>
</svg>
