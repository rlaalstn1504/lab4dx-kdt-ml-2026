<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">웹 페이지와 개발자도구를 기준으로 본 크롤링 배경지식</title>
  <desc id="desc">URL, 브라우저, 개발자도구, 서버 응답, HTML DOM, CSS 선택자가 크롤링에서 어떻게 연결되는지 보여주는 그림</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .kr { font-family: "Noto Sans CJK KR", "Noto Sans KR", Arial, sans-serif; }
      .mono { font-family: Consolas, "Noto Sans Mono CJK KR", monospace; }
      .label { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .title { font-size: 19px; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <rect width="1040" height="560" fill="#ffffff"/>
  <text x="520" y="42" text-anchor="middle" class="kr" font-size="28" font-weight="700" fill="#111827">
    웹 페이지는 요청, 응답, HTML 구조, 개발자도구로 이해한다
  </text>

  <rect x="48" y="84" width="420" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="116" class="kr title">URL</text>
  <text x="70" y="146" class="mono" font-size="14" fill="#1e293b">https://finance.naver.com/item/sise_day.naver?code=005930&amp;page=1</text>
  <text x="70" y="166" class="kr small">프로토콜 + 도메인 + 경로 + 쿼리 파라미터</text>

  <rect x="48" y="216" width="230" height="176" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="163" y="252" text-anchor="middle" class="kr title" fill="#1d4ed8">브라우저</text>
  <text x="163" y="284" text-anchor="middle" class="kr label">URL로 서버에 요청</text>
  <text x="163" y="312" text-anchor="middle" class="kr label">HTML/CSS/JS를 받아 화면 표시</text>
  <text x="163" y="340" text-anchor="middle" class="kr label">JavaScript가 추가 요청 가능</text>
  <text x="163" y="368" text-anchor="middle" class="mono" font-size="13" fill="#1e3a8a">document / DOM</text>

  <rect x="320" y="216" width="220" height="176" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="430" y="252" text-anchor="middle" class="kr title" fill="#166534">개발자도구</text>
  <rect x="346" y="276" width="168" height="30" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="430" y="296" text-anchor="middle" class="kr small">Elements: HTML 위치 찾기</text>
  <rect x="346" y="318" width="168" height="30" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="430" y="338" text-anchor="middle" class="kr small">Network: 요청 URL 확인</text>
  <rect x="346" y="360" width="168" height="30" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="430" y="380" text-anchor="middle" class="kr small">Console: 선택자 테스트</text>

  <line x1="540" y1="304" x2="626" y2="304" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="582" y="290" text-anchor="middle" class="kr small">HTTP 요청</text>

  <rect x="646" y="216" width="158" height="176" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="725" y="252" text-anchor="middle" class="kr title" fill="#9a3412">웹 서버</text>
  <text x="725" y="288" text-anchor="middle" class="kr label">HTML 문서</text>
  <text x="725" y="316" text-anchor="middle" class="kr label">이미지, CSS</text>
  <text x="725" y="344" text-anchor="middle" class="kr label">JavaScript</text>
  <text x="725" y="372" text-anchor="middle" class="kr label">API 응답(JSON)</text>

  <line x1="804" y1="304" x2="868" y2="304" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="836" y="290" text-anchor="middle" class="kr small">응답</text>

  <rect x="884" y="198" width="112" height="212" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="940" y="232" text-anchor="middle" class="kr title" fill="#6b21a8">파싱</text>
  <text x="940" y="266" text-anchor="middle" class="mono" font-size="13" fill="#581c87">BeautifulSoup</text>
  <text x="940" y="298" text-anchor="middle" class="mono" font-size="12" fill="#475569">table.type2 tr</text>
  <text x="940" y="326" text-anchor="middle" class="mono" font-size="12" fill="#475569">td.title a.tit</text>
  <text x="940" y="360" text-anchor="middle" class="kr small">필요한 값만</text>
  <text x="940" y="382" text-anchor="middle" class="kr small">표로 저장</text>

  <rect x="120" y="440" width="800" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="520" y="468" text-anchor="middle" class="kr" font-size="16" font-weight="700" fill="#111827">
    크롤링 코드는 브라우저가 하는 일을 단순화해 반복한다
  </text>
  <text x="520" y="494" text-anchor="middle" class="kr" font-size="14" fill="#475569">
    개발자도구로 실제 요청과 HTML 위치를 확인한 뒤, 코드에서 같은 URL을 요청하고 같은 선택자로 값을 추출한다
  </text>
</svg>
