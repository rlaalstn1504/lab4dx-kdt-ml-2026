<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="980" height="560" rx="18" fill="#f8fafc"/>

  <text x="490" y="44" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">
    Word2Vec 비유: 주변 친구가 비슷한 단어끼리 가까워진다
  </text>
  <text x="490" y="76" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#475569">
    단어 뜻을 직접 외우는 것이 아니라, 문장 속에서 자주 함께 다니는 단어를 보고 관계를 파악한다고 생각합니다.
  </text>

  <g filter="url(#shadow)">
    <rect x="38" y="112" width="280" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  </g>
  <text x="58" y="146" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">
    1. 문장에서 단어 친구 찾기
  </text>
  <text x="58" y="175" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#475569">
    가까이 자주 나오는 단어를 친구처럼 봅니다.
  </text>

  <rect x="60" y="215" width="236" height="42" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="178" y="242" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#1e3a8a">은행에서 돈을 입금했다</text>

  <rect x="60" y="272" width="236" height="42" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="178" y="299" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#1e3a8a">대출 금리가 올랐다</text>

  <rect x="60" y="344" width="236" height="42" rx="9" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="178" y="371" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#166534">사과는 달콤한 과일이다</text>

  <rect x="60" y="401" width="236" height="42" rx="9" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="178" y="428" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="16" fill="#166534">바나나를 먹었다</text>

  <path d="M 326 292 L 380 292" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="388" y="112" width="240" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  </g>
  <text x="408" y="146" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">
    2. 친구 목록이 생김
  </text>
  <text x="408" y="175" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#475569">
    단어마다 자주 만난 친구가 다릅니다.
  </text>

  <rect x="414" y="212" width="188" height="78" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="508" y="237" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">은행</text>
  <text x="508" y="264" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" fill="#1e3a8a">돈 · 입금 · 대출 · 금리</text>

  <rect x="414" y="310" width="188" height="78" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="508" y="335" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">대출</text>
  <text x="508" y="362" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" fill="#1e3a8a">은행 · 돈 · 금리</text>

  <rect x="414" y="408" width="188" height="78" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="508" y="433" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="700" fill="#166534">사과</text>
  <text x="508" y="460" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" fill="#166534">과일 · 달콤한 · 먹다</text>

  <path d="M 636 292 L 690 292" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="698" y="112" width="244" height="360" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  </g>
  <text x="718" y="146" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">
    3. 비슷한 친구끼리 가까운 자리
  </text>
  <text x="718" y="175" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#475569">
    나중에 그림으로 보면 이렇게 모여 보입니다.
  </text>

  <rect x="724" y="210" width="190" height="112" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-dasharray="6 5"/>
  <text x="819" y="236" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">금융 관련 자리</text>
  <circle cx="772" cy="273" r="25" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="772" y="279" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#1e3a8a">은행</text>
  <circle cx="834" cy="275" r="25" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="834" y="281" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#1e3a8a">대출</text>
  <circle cx="803" cy="300" r="25" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="803" y="306" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#1e3a8a">금리</text>

  <rect x="724" y="344" width="190" height="102" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-dasharray="6 5"/>
  <text x="819" y="370" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">음식 관련 자리</text>
  <circle cx="776" cy="407" r="25" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="776" y="413" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#166534">사과</text>
  <circle cx="848" cy="407" r="29" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="848" y="413" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#166534">바나나</text>

  <text x="490" y="520" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">
    핵심 비유: 단어마다 "자주 만나는 친구 목록"을 만들고, 친구 목록이 비슷한 단어끼리 가까운 자리로 모인다고 생각합니다.
  </text>
  <text x="490" y="545" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="14" fill="#475569">
    실제 실습에서는 이 관계를 숫자 벡터로 저장하고, PCA로 2차원 그림처럼 시각화합니다.
  </text>
</svg>
