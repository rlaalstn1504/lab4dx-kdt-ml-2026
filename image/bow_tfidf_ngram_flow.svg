<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">BoW TF-IDF N-gram 비교</title>
  <desc id="desc">같은 문장을 BoW, TF-IDF, N-gram으로 표현할 때 각각 무엇을 보는지 비교한 도식</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .kr { font-family: "Noto Sans CJK KR", "Noto Sans KR", Arial, sans-serif; }
      .mono { font-family: Consolas, "Noto Sans Mono CJK KR", monospace; }
    </style>
  </defs>
  <rect width="980" height="540" fill="#ffffff"/>
  <text x="490" y="44" text-anchor="middle" class="kr" font-size="28" font-weight="700" fill="#111827">
    통계 기반 벡터화는 무엇을 숫자로 바꾸는가
  </text>

  <rect x="110" y="86" width="760" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="490" y="128" text-anchor="middle" class="kr" font-size="19" font-weight="700" fill="#111827">
    문서: 배송 지연으로 환불 요청이 증가했다
  </text>

  <line x1="490" y1="158" x2="490" y2="196" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="54" y="212" width="270" height="220" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="189" y="248" text-anchor="middle" class="kr" font-size="21" font-weight="700" fill="#1d4ed8">BoW</text>
  <text x="189" y="278" text-anchor="middle" class="kr" font-size="15" fill="#475569">단어가 몇 번 나왔는가</text>
  <g transform="translate(86 304)">
    <rect x="0" y="0" width="206" height="34" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="16" y="23" class="kr" font-size="14" fill="#1e3a8a">배송</text>
    <text x="78" y="23" class="mono" font-size="14" fill="#1e3a8a">1</text>
    <text x="122" y="23" class="kr" font-size="14" fill="#1e3a8a">환불</text>
    <text x="184" y="23" class="mono" font-size="14" fill="#1e3a8a">1</text>
    <rect x="0" y="42" width="206" height="34" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="16" y="65" class="kr" font-size="14" fill="#1e3a8a">요청</text>
    <text x="78" y="65" class="mono" font-size="14" fill="#1e3a8a">1</text>
    <text x="122" y="65" class="kr" font-size="14" fill="#1e3a8a">증가</text>
    <text x="184" y="65" class="mono" font-size="14" fill="#1e3a8a">1</text>
  </g>
  <text x="189" y="396" text-anchor="middle" class="kr" font-size="14" fill="#475569">단어 순서와 문맥은</text>
  <text x="189" y="416" text-anchor="middle" class="kr" font-size="14" fill="#475569">거의 반영하지 않음</text>

  <rect x="355" y="212" width="270" height="220" rx="10" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <text x="490" y="248" text-anchor="middle" class="kr" font-size="21" font-weight="700" fill="#854d0e">TF-IDF</text>
  <text x="490" y="278" text-anchor="middle" class="kr" font-size="15" fill="#475569">문서 안 빈도 × 전체 희소성</text>
  <g transform="translate(386 304)">
    <rect x="0" y="0" width="206" height="34" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="16" y="23" class="kr" font-size="14" fill="#854d0e">배송</text>
    <rect x="70" y="8" width="112" height="18" rx="4" fill="#f59e0b"/>
    <rect x="0" y="42" width="206" height="34" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="16" y="65" class="kr" font-size="14" fill="#854d0e">요청</text>
    <rect x="70" y="50" width="74" height="18" rx="4" fill="#f59e0b"/>
    <rect x="0" y="84" width="206" height="34" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="16" y="107" class="kr" font-size="14" fill="#854d0e">그리고</text>
    <rect x="70" y="92" width="20" height="18" rx="4" fill="#fbbf24"/>
  </g>
  <text x="490" y="398" text-anchor="middle" class="kr" font-size="14" fill="#475569">흔한 단어는 낮게,</text>
  <text x="490" y="418" text-anchor="middle" class="kr" font-size="14" fill="#475569">특징 단어는 높게</text>

  <rect x="656" y="212" width="270" height="220" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="791" y="248" text-anchor="middle" class="kr" font-size="21" font-weight="700" fill="#166534">N-gram</text>
  <text x="791" y="278" text-anchor="middle" class="kr" font-size="15" fill="#475569">연속된 단어 묶음을 본다</text>
  <g transform="translate(692 306)">
    <rect x="0" y="0" width="198" height="30" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="99" y="20" text-anchor="middle" class="kr" font-size="14" fill="#14532d">배송 지연</text>
    <rect x="0" y="42" width="198" height="30" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="99" y="62" text-anchor="middle" class="kr" font-size="14" fill="#14532d">환불 요청</text>
    <rect x="0" y="84" width="198" height="30" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="99" y="104" text-anchor="middle" class="kr" font-size="14" fill="#14532d">요청 증가</text>
  </g>
  <text x="791" y="398" text-anchor="middle" class="kr" font-size="14" fill="#475569">짧은 문맥 패턴을</text>
  <text x="791" y="418" text-anchor="middle" class="kr" font-size="14" fill="#475569">일부 보존</text>

  <text x="490" y="482" text-anchor="middle" class="kr" font-size="16" fill="#475569">
    세 방법 모두 유용하지만,
  </text>
  <text x="490" y="508" text-anchor="middle" class="kr" font-size="16" fill="#475569">
    단어 의미를 직접 학습한 밀집 임베딩과는 목적이 다르다.
  </text>
</svg>
